name: Build Scan Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate Backstage Catalog
        run: node tools/backstage-generator/generate.js

      - name: Build Image
        run: docker build -t ghcr.io/${{ github.repository }}/api:latest ./apps/api || true # Mock build for demonstration

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/api:latest || true

      - name: Trigger Argo CD Sync
        if: success()
        run: |
          echo "Triggering Argo CD hard refresh..."
          # In a real setup, you would use argocd CLI or a webhook:
          # curl -X POST https://${{ secrets.ARGOCD_URL }}/api/v1/applications/home-platform/sync -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}"
