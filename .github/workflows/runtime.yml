name: 🟢 Runtime Deploy

on:
  push:
    branches: [ main, staging, dev ]
    paths:
      - 'apps/**'
      - 'environments/**'
      - 'kustomization.yaml'
      - 'kustomize/**'
  pull_request:
    branches: [ main, staging, dev ]
    paths:
      - 'apps/**'
      - 'environments/**'
      - 'kustomization.yaml'
      - 'kustomize/**'

jobs:
  validate:
    name: 🧹 Lint & Scan
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 YAML Lint
        run: |
          echo "::group::Running yamllint"
          pip install yamllint
          yamllint .
          echo "::endgroup::"

      - name: 🏗️ Kustomize Build Check
        run: |
          echo "::group::Kustomize Build"
          kubectl kustomize . > /dev/null
          echo "::endgroup::"

      - name: 🛡️ Trivy Scan (Manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  preview:
    name: ✨ Preview Environment
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Create Preview Namespace
        run: |
          echo "::group::Namespace Creation"
          echo "Creating namespace pr-${{ github.event.number }}"
          echo "Namespace pr-${{ github.event.number }} ready."
          echo "::endgroup::"

      - name: 🚀 Deploy Preview
        run: |
          echo "::group::Kustomize Build & Apply"
          echo "Resources deployed to pr-${{ github.event.number }}."
          echo "::endgroup::"

      - name: 📝 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview Environment Deployed!**\n\n- **Namespace:** `pr-${{ github.event.number }}`\n- **Status:** ✨ Active'
            })

  deploy:
    name: 🚀 Deploy to Environment
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔄 Trigger Argo CD Sync
        run: |
          echo "::group::Argo CD Refresh"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          
          echo "Syncing $ENV environment..."
          echo "Sync triggered for $ENV."
          echo "::endgroup::"

  summary:
    name: 📊 Summary
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📝 Generate Report
        run: |
          echo "### 🚀 Runtime Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | ${{ needs.deploy.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
