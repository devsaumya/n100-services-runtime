apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: influxdb
  namespace: argocd
spec:
  project: default
  source:
    chart: influxdb2
    repoURL: https://helm.influxdata.com/
    targetRevision: 2.1.2
    helm:
      values: |
        persistence:
          enabled: true
          size: 10Gi
        adminUser:
          organization: "home"
          bucket: "iot-telemetry"
  destination:
    server: https://kubernetes.default.svc
    namespace: iot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
