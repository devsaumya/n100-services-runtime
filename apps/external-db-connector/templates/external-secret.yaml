apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mongodb.secretName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mongodb.secretName }}
  data:
  - secretKey: MONGODB_URI
    remoteRef:
      key: {{ .Values.mongodb.bitwardenKey }}
